server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /kw/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Public gameplay WebSocket. Cloudflare Tunnel terminates HTTPS/WSS and
    # forwards the upgraded connection here without any router port forward.
    location /game {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://kw_3d_duel_ws:18887/;
    }

    location = /kw/update_manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /kw/online_config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /kw/KWUpdater.exe {
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
        add_header Content-Disposition "attachment; filename=KWUpdater.exe";
        try_files $uri =404;
    }

    location /kw/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /kw/index.html;
    }
}
